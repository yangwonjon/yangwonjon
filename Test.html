<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>휴대폰 정보 조회 - 최근 방문자</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 40px;
      max-width: 700px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .current-device {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
      text-align: center;
    }

    .current-device h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .device-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 15px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-radius: 8px;
    }

    .info-label {
      font-size: 12px;
      opacity: 0.9;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 18px;
      font-weight: bold;
    }

    .battery-bar {
      width: 100%;
      height: 20px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    .battery-fill {
      height: 100%;
      background: #4ade80;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: white;
      font-weight: bold;
    }

    .section-title {
      margin-top: 30px;
      margin-bottom: 15px;
      color: #333;
      font-size: 18px;
      font-weight: bold;
    }

    #visitorList {
      list-style: none;
    }

    .visitor-item {
      background: #f8f9fa;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 5px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .visitor-item:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
    }

    .visitor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .visitor-model {
      color: #667eea;
      font-weight: bold;
      font-size: 16px;
    }

    .visitor-time {
      color: #999;
      font-size: 12px;
    }

    .visitor-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .visitor-detail {
      font-size: 13px;
      color: #666;
    }

    .visitor-detail span {
      font-weight: bold;
      color: #333;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 20px;
      font-size: 14px;
    }

    .visitor-count {
      display: inline-block;
      background: #667eea;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 휴대폰 정보</h1>
    <p class="subtitle">현재 사용 중인 기기 정보 및 최근 방문자</p>

    <!-- 현재 기기 정보 -->
    <div class="current-device">
      <h2>🎯 당신의 기기</h2>
      <div class="device-info">
        <div class="info-box">
          <div class="info-label">기종</div>
          <div class="info-value" id="deviceModel">감지 중...</div>
        </div>
        <div class="info-box">
          <div class="info-label">배터리</div>
          <div class="info-value" id="batteryPercent">감지 중...</div>
        </div>
      </div>
      <div class="battery-bar">
        <div class="battery-fill" id="batteryFill" style="width: 0%">
          <span id="batteryText"></span>
        </div>
      </div>
    </div>

    <!-- 최근 방문자 목록 -->
    <div>
      <h2 class="section-title">
        👥 최근 방문자
        <span class="visitor-count" id="visitorCount">0</span>
      </h2>
      <ul id="visitorList"></ul>
    </div>
  </div>

  <script>
    // Supabase 설정
    const SUPABASE_URL = 'https://wmpqwkvbhpikoyepecya.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcHF3a3ZiaHBpa295ZXBlY3lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDg1OTgsImV4cCI6MjA5MTEyNDU5OH0.QB2jIsi_dXzrS-cAY3MCKfjO9p69a7pJ2PDEbflE4V0';

    // 현재 기기 정보 감지
    function detectDevice() {
      const userAgent = navigator.userAgent;
      let deviceModel = '알 수 없음';

      if (/iPhone/.test(userAgent)) {
        if (/iPhone 15/.test(userAgent)) deviceModel = 'iPhone 15';
        else if (/iPhone 14/.test(userAgent)) deviceModel = 'iPhone 14';
        else if (/iPhone 13/.test(userAgent)) deviceModel = 'iPhone 13';
        else deviceModel = 'iPhone';
      } else if (/Android/.test(userAgent)) {
        if (/Samsung/.test(userAgent)) deviceModel = 'Samsung Galaxy';
        else if (/Pixel/.test(userAgent)) deviceModel = 'Google Pixel';
        else if (/OnePlus/.test(userAgent)) deviceModel = 'OnePlus';
        else deviceModel = 'Android Device';
      } else {
        deviceModel = 'PC/태블릿';
      }

      return deviceModel;
    }

    // 화면 해상도 감지
    function getResolution() {
      return `${window.screen.width}x${window.screen.height}`;
    }

    // 배터리 정보 가져오기
    async function getBatteryInfo() {
      let batteryLevel = 75;

      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();
          batteryLevel = Math.round(battery.level * 100);
        } catch (e) {
          batteryLevel = Math.floor(Math.random() * 50) + 50;
        }
      } else {
        batteryLevel = Math.floor(Math.random() * 50) + 50;
      }

      document.getElementById('batteryPercent').textContent = `${batteryLevel}%`;
      const fillDiv = document.getElementById('batteryFill');
      fillDiv.style.width = batteryLevel + '%';
      document.getElementById('batteryText').textContent = batteryLevel + '%';

      if (batteryLevel > 50) {
        fillDiv.style.background = '#4ade80';
      } else if (batteryLevel > 20) {
        fillDiv.style.background = '#facc15';
      } else {
        fillDiv.style.background = '#ef4444';
      }

      return batteryLevel;
    }

    // 방문 기록 저장
    async function saveVisit(deviceModel, batteryLevel, resolution) {
      try {
        await fetch(
          `${SUPABASE_URL}/rest/v1/visits`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({
              device_model: deviceModel,
              battery_level: batteryLevel,
              resolution: resolution,
              user_agent: navigator.userAgent
            })
          }
        );
        console.log('✅ 방문 기록 저장됨');
      } catch (error) {
        console.error('방문 기록 저장 실패:', error);
      }
    }

    // 방문자 목록 불러오기 (한 번만)
    async function loadVisitors() {
      const visitorList = document.getElementById('visitorList');
      
      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/visits?order=visited_at.desc&limit=20`,
          {
            headers: {
              'Content-Type': 'application/json',
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          throw new Error('데이터 로드 실패');
        }

        const data = await response.json();

        if (data.length === 0) {
          visitorList.innerHTML = '<div class="empty">아직 방문자가 없습니다.</div>';
          document.getElementById('visitorCount').textContent = '0';
          return;
        }

        visitorList.innerHTML = '';
        document.getElementById('visitorCount').textContent = data.length;

        data.forEach((visitor, index) => {
          const li = document.createElement('li');
          li.className = 'visitor-item';
          
          const visitDate = new Date(visitor.visited_at);
          const timeString = formatTime(visitDate);

          li.innerHTML = `
            <div class="visitor-header">
              <span class="visitor-model">🔢 ${index + 1}. ${visitor.device_model}</span>
              <span class="visitor-time">${timeString}</span>
            </div>
            <div class="visitor-info">
              <div class="visitor-detail">
                🔋 배터리: <span>${visitor.battery_level}%</span>
              </div>
              <div class="visitor-detail">
                📐 해상도: <span>${visitor.resolution}</span>
              </div>
            </div>
          `;

          visitorList.appendChild(li);
        });

      } catch (error) {
        visitorList.innerHTML = '<div class="empty">데이터 로드 중 오류가 발생했습니다.</div>';
        console.error('Error:', error);
      }
    }

    // 시간 포맷팅
    function formatTime(date) {
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return '방금 전';
      if (diffMins < 60) return `${diffMins}분 전`;
      if (diffHours < 24) return `${diffHours}시간 전`;
      if (diffDays === 1) return '어제';
      if (diffDays < 7) return `${diffDays}일 전`;

      return date.toLocaleDateString('ko-KR');
    }

    // 페이지 로드 시 한 번만 실행
    window.addEventListener('load', async function() {
      // 현재 기기 정보 표시
      const model = detectDevice();
      document.getElementById('deviceModel').textContent = model;
      
      const resolution = getResolution();
      const batteryLevel = await getBatteryInfo();

      // 방문 기록 한 번만 저장
      await saveVisit(model, batteryLevel, resolution);

      // 방문자 목록 한 번만 로드
      loadVisitors();
    });
  </script>
</body>
</html>
