<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스 앱 열기</title>
</head>
<body>
    <div style="padding: 50px; text-align: center;">
        <button onclick="openToss()" style="padding: 20px; font-size: 18px; background: #0050FF; color: white; border: none; border-radius: 10px; width: 100%;">
            토스 앱 바로 열기
        </button>

        <br><br>

        <button onclick="sendMoney()" style="padding: 20px; font-size: 18px; background: #3182f6; color: white; border: none; border-radius: 10px; width: 100%;">
            토스 송금 화면 열기 (1,000원)
        </button>
    </div>

    <script>
        function openToss() {
            // 토스 앱의 커스텀 스킴(Scheme) 주소입니다.
            const tossScheme = "supertoss://";
            
            // 앱 실행 시도
            window.location.href = tossScheme;

            // 앱이 안 깔려있을 경우를 대비해 2초 후 스토어로 이동 (선택 사항)
            setTimeout(function() {
                if (confirm("토스 앱이 설치되어 있지 않은 것 같습니다. 스토어로 이동할까요?")) {
                    window.location.href = "https://play.google.com/store/apps/details?id=viva.republica.toss";
                }
            }, 2000);
        }

        function sendMoney() {
            // 특정 금액과 함께 송금 화면으로 바로 가는 링크
            // (참고: 보안 정책에 따라 일부 파라미터는 제한될 수 있습니다)
            window.location.href = "supertoss://send?amount=1000";
        }
    </script>
</body>
</html>
