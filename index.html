<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스 v2 테스트</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
    <div style="padding: 50px; text-align: center;">
        <button id="payment-button" style="padding: 20px 40px; background-color: #0050FF; color: white; border: none; border-radius: 12px; font-size: 20px; font-weight: bold;">
            토스 결제창 띄우기
        </button>
    </div>

    <script>
        // 1. 문서에 있는 테스트용 API 개별 연동 키 (직접 발급 전까지 이거 쓰세요)
        const clientKey = "test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq"; 
        
        // 2. SDK 초기화
        const tossPayments = TossPayments(clientKey);
        
        // 3. 결제창 초기화 (customerKey는 무작위 문자열)
        const payment = tossPayments.payment({ 
            customerKey: "user_" + Math.random().toString(36).substring(2, 10) 
        });

        document.getElementById('payment-button').addEventListener('click', async function () {
            try {
                // 4. 결제 요청 (문서의 카드 리다이렉트 방식)
                await payment.requestPayment({
                    method: "CARD", 
                    amount: {
                        currency: "KRW",
                        value: 1000,
                    },
                    orderId: "order-" + new Date().getTime(),
                    orderName: "테스트 상품",
                    successUrl: window.location.origin,
                    failUrl: window.location.origin,
                });
            } catch (error) {
                // 에러 발생 시 알림
                alert("코드: " + error.code + "\n메시지: " + error.message);
            }
        });
    </script>
</body>
</html>
