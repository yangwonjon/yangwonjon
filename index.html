<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 실행 테스트</title>
    <style>
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; cursor: pointer; border: none; border-radius: 10px; color: white; }
        .kakao { background-color: #FEE500; color: #3c1e1e; }
        .insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .toss { background-color: #0050FF; }
    </style>
</head>
<body>

    <h2>앱 실행 최종 테스트</h2>

    <button class="kakao" onclick="openApp('intent://kakaotalk/#Intent;scheme=kakaotalk;package=com.kakao.talk;end')">카카오톡 열기 (안드로이드 전용)</button>
    <button class="kakao" onclick="openApp('kakaotalk://')">카카오톡 열기 (기본)</button>

    <button class="insta" onclick="openApp('instagram://user?username=instagram')">인스타그램 앱 열기</button>

    <button class="toss" onclick="openApp('supertoss://')">토스 열기</button>

    <script>
        function openApp(url) {
            const start = Date.now();
            
            // 앱 실행 시도
            window.location.href = url;

            // 앱이 안 열릴 경우 0.8초 후 반응 확인 (안드로이드 등에서 유용)
            setTimeout(function() {
                if (Date.now() - start < 1500) {
                    console.log("앱이 설치되지 않았거나 실행할 수 없습니다.");
                }
            }, 800);
        }
    </script>
</body>
</html>
