<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스 에러 체크</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>
    <div style="padding: 20px; text-align: center;">
        <h2>토스 결제 테스트</h2>
        <button id="check-btn" style="width: 100%; height: 60px; background-color: #0050FF; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold;">
            결제창 띄우기
        </button>
    </div>

    <script>
        // 버튼 클릭 시 실행
        document.getElementById('check-btn').addEventListener('click', function () {
            try {
                // 1. SDK 로드 확인
                if (typeof TossPayments === 'undefined') {
                    alert("에러: 토스 SDK가 불러와지지 않았습니다. 인터넷 연결이나 스크립트 주소를 확인하세요.");
                    return;
                }

                const tossPayments = TossPayments("test_ck_D5mOjkJdnVvZEdAnExV8zYpW92mx");

                // 2. 결제 요청 및 에러 캐치
                tossPayments.requestPayment('카드', {
                    amount: 1000,
                    orderId: 'err-test-' + new Date().getTime(),
                    orderName: '테스트 결제',
                    successUrl: window.location.origin,
                    failUrl: window.location.origin,
                }).catch(function (error) {
                    // 여기서 발생하는 에러를 알림창으로 띄움
                    alert("토스 API 에러 발생!\n코드: " + error.code + "\n메시지: " + error.message);
                });

            } catch (e) {
                // 코드 자체의 실행 에러 확인
                alert("자바스크립트 실행 에러: " + e.message);
            }
        });
    </script>
</body>
</html>
