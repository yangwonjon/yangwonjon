<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기기 정보 수집 - 전체</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .info-card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .info-card h2 {
      color: #667eea;
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .info-item {
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .info-item:last-child {
      margin-bottom: 0;
      padding-bottom: 0;
      border-bottom: none;
    }

    .info-label {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 14px;
      color: #333;
      word-break: break-all;
      background: #f8f9fa;
      padding: 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    .info-value.loading {
      color: #999;
      font-style: italic;
    }

    .info-value.error {
      color: #c33;
    }

    .info-value.success {
      color: #4ade80;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 20px;
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    button:hover {
      background: #667eea;
      color: white;
    }

    .export-section {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .export-section h2 {
      color: #667eea;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: vertical;
    }

    .copy-btn {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .copy-btn:hover {
      background: #764ba2;
    }

    .permission-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      margin-left: 5px;
    }

    .permission-badge.required {
      background: #fee;
      color: #c33;
    }

    .permission-badge.optional {
      background: #fef3cd;
      color: #856404;
    }

    .permission-badge.granted {
      background: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📱 기기 정보 수집 - 전체</h1>

    <div class="button-group">
      <button onclick="collectAllInfo()">🔄 모든 정보 수집</button>
      <button onclick="requestPermissions()">🔐 권한 요청</button>
      <button onclick="clearInfo()">🗑️ 초기화</button>
    </div>

    <div class="info-grid" id="infoGrid"></div>

    <div class="export-section">
      <h2>📋 JSON 내보내기</h2>
      <textarea id="exportData" readonly></textarea>
      <button class="copy-btn" onclick="copyToClipboard()">📋 복사</button>
    </div>
  </div>

  <script>
    // 모든 정보를 저장할 객체
    let allInfo = {};

    // 정보 수집 함수
    async function collectAllInfo() {
      console.log('🔄 정보 수집 시작...');

      // 1. 기본 기기 정보
      allInfo.device = getDeviceInfo();

      // 2. 화면 정보
      allInfo.screen = getScreenInfo();

      // 3. 브라우저 정보
      allInfo.browser = getBrowserInfo();

      // 4. 네트워크 정보
      allInfo.network = getNetworkInfo();

      // 5. 배터리 정보
      allInfo.battery = await getBatteryInfo();

      // 6. 센서 정보
      allInfo.sensors = getSensorInfo();

      // 7. 시간대 정보
      allInfo.timezone = getTimezoneInfo();

      // 8. 스토리지 정보
      allInfo.storage = getStorageInfo();

      // 9. 미디어 정보
      allInfo.media = getMediaInfo();

      // 10. WebGL 정보
      allInfo.webgl = getWebGLInfo();

      // 11. IP 정보
      allInfo.ip = await getIPInfo();

      // 12. 위치 정보
      allInfo.location = await getLocationInfo();

      // UI 업데이트
      displayInfo();
      exportToJSON();

      console.log('✅ 정보 수집 완료!', allInfo);
    }

    // 1. 기본 기기 정보
    function getDeviceInfo() {
      return {
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages || [navigator.language],
        cpuCores: navigator.hardwareConcurrency || 'N/A',
        deviceMemory: navigator.deviceMemory || 'N/A' + ' GB',
        maxTouchPoints: navigator.maxTouchPoints || 0,
        vendor: navigator.vendor,
        oscpu: navigator.oscpu || 'N/A',
        buildID: navigator.buildID || 'N/A'
      };
    }

    // 2. 화면 정보
    function getScreenInfo() {
      return {
        width: window.screen.width,
        height: window.screen.height,
        availWidth: window.screen.availWidth,
        availHeight: window.screen.availHeight,
        colorDepth: window.screen.colorDepth,
        pixelDepth: window.screen.pixelDepth,
        devicePixelRatio: window.devicePixelRatio,
        orientation: screen.orientation?.type || 'N/A',
        windowInnerWidth: window.innerWidth,
        windowInnerHeight: window.innerHeight,
        outerWidth: window.outerWidth,
        outerHeight: window.outerHeight
      };
    }

    // 3. 브라우저 정보
    function getBrowserInfo() {
      return {
        appName: navigator.appName,
        appVersion: navigator.appVersion,
        cookieEnabled: navigator.cookieEnabled,
        onLine: navigator.onLine,
        doNotTrack: navigator.doNotTrack,
        javaEnabled: typeof navigator.javaEnabled === 'function' ? navigator.javaEnabled() : 'N/A',
        plugins: Array.from(navigator.plugins || []).map(p => p.name),
        pluginCount: navigator.plugins?.length || 0,
        mimeTypes: Array.from(navigator.mimeTypes || []).map(m => m.type)
      };
    }

    // 4. 네트워크 정보
    function getNetworkInfo() {
      const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      return {
        type: connection?.type || 'N/A',
        effectiveType: connection?.effectiveType || 'N/A',
        downlink: connection?.downlink || 'N/A',
        rtt: connection?.rtt || 'N/A',
        saveData: connection?.saveData || false,
        online: navigator.onLine
      };
    }

    // 5. 배터리 정보
    async function getBatteryInfo() {
      if ('getBattery' in navigator) {
        try {
          const battery = await navigator.getBattery();
          return {
            level: Math.round(battery.level * 100) + '%',
            charging: battery.charging,
            chargingTime: battery.chargingTime + 's',
            dischargingTime: battery.dischargingTime + 's'
          };
        } catch (e) {
          return { error: 'Battery API 접근 불가' };
        }
      } else {
        return { error: 'Battery API 미지원' };
      }
    }

    // 6. 센서 정보
    function getSensorInfo() {
      return {
        accelerometer: 'Accelerometer' in window ? '지원' : '미지원',
        gyroscope: 'Gyroscope' in window ? '지원' : '미지원',
        magnetometer: 'Magnetometer' in window ? '지원' : '미지원',
        linearAccelerationSensor: 'LinearAccelerationSensor' in window ? '지원' : '미지원',
        geolocation: 'geolocation' in navigator ? '지원' : '미지원'
      };
    }

    // 7. 시간대 정보
    function getTimezoneInfo() {
      return {
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        offset: new Date().getTimezoneOffset() + ' 분',
        localTime: new Date().toLocaleString('ko-KR'),
        utcTime: new Date().toUTCString()
      };
    }

    // 8. 스토리지 정보
    function getStorageInfo() {
      return {
        localStorageSupported: typeof Storage !== 'undefined' ? '지원' : '미지원',
        sessionStorageSupported: typeof sessionStorage !== 'undefined' ? '지원' : '미지원',
        indexedDBSupported: 'indexedDB' in window ? '지원' : '미지원',
        cookiesEnabled: navigator.cookieEnabled ? '활성화' : '비활성화'
      };
    }

    // 9. 미디어 정보
    function getMediaInfo() {
      return {
        mediaDevices: 'mediaDevices' in navigator ? '지원' : '미지원',
        getUserMedia: navigator.mediaDevices?.getUserMedia ? '지원' : '미지원',
        enumerateDevices: navigator.mediaDevices?.enumerateDevices ? '지원' : '미지원',
        audioContext: 'AudioContext' in window || 'webkitAudioContext' in window ? '지원' : '미지원'
      };
    }

    // 10. WebGL 정보
    function getWebGLInfo() {
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
        
        return {
          supported: '지원',
          vendor: gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL),
          renderer: gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL),
          version: gl.getParameter(gl.VERSION),
          shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION)
        };
      } catch (e) {
        return { error: 'WebGL 미지원' };
      }
    }

    // 11. IP 정보 (외부 API)
    async function getIPInfo() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        return {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country: data.country_name,
          countryCode: data.country_code,
          latitude: data.latitude,
          longitude: data.longitude,
          timezone: data.timezone,
          isp: data.org,
          currency: data.currency
        };
      } catch (e) {
        return { error: 'IP 정보 조회 실패' };
      }
    }

    // 12. GPS 위치 정보 (권한 필요)
    async function getLocationInfo() {
      return new Promise((resolve) => {
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy + 'm',
                altitude: position.coords.altitude || 'N/A',
                altitudeAccuracy: position.coords.altitudeAccuracy || 'N/A',
                heading: position.coords.heading || 'N/A',
                speed: position.coords.speed || 'N/A'
              });
            },
            (error) => {
              resolve({ error: error.message });
            },
            { timeout: 5000 }
          );
        } else {
          resolve({ error: 'Geolocation 미지원' });
        }
      });
    }

    // UI에 정보 표시
    function displayInfo() {
      const grid = document.getElementById('infoGrid');
      grid.innerHTML = '';

      const sections = [
        { title: '📱 기본 기기 정보', data: allInfo.device },
        { title: '📺 화면 정보', data: allInfo.screen },
        { title: '🌐 브라우저 정보', data: allInfo.browser },
        { title: '🔌 네트워크 정보', data: allInfo.network },
        { title: '🔋 배터리 정보', data: allInfo.battery },
        { title: '📡 센서 정보', data: allInfo.sensors },
        { title: '🕐 시간대 정보', data: allInfo.timezone },
        { title: '💾 스토리지 정보', data: allInfo.storage },
        { title: '🎥 미디어 정보', data: allInfo.media },
        { title: '🎨 WebGL 정보', data: allInfo.webgl },
        { title: '🌍 IP 정보', data: allInfo.ip },
        { title: '🗺️ 위치 정보', data: allInfo.location }
      ];

      sections.forEach(section => {
        const card = document.createElement('div');
        card.className = 'info-card';
        card.innerHTML = `<h2>${section.title}</h2>`;

        Object.entries(section.data || {}).forEach(([key, value]) => {
          const item = document.createElement('div');
          item.className = 'info-item';
          item.innerHTML = `
            <div class="info-label">${key}</div>
            <div class="info-value">${
              Array.isArray(value) ? value.join(', ') : value
            }</div>
          `;
          card.appendChild(item);
        });

        grid.appendChild(card);
      });
    }

    // JSON 내보내기
    function exportToJSON() {
      const json = JSON.stringify(allInfo, null, 2);
      document.getElementById('exportData').value = json;
    }

    // 클립보드 복사
    function copyToClipboard() {
      const textarea = document.getElementById('exportData');
      textarea.select();
      document.execCommand('copy');
      alert('📋 복사되었습니다!');
    }

    // 권한 요청
    async function requestPermissions() {
      // Geolocation 권한
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          () => console.log('✅ GPS 권한 승인'),
          () => console.log('❌ GPS 권한 거부')
        );
      }

      // 카메라/마이크 권한
      try {
        await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        console.log('✅ 카메라/마이크 권한 승인');
      } catch (e) {
        console.log('❌ 카메라/마이크 권한 거부:', e.message);
      }
    }

    // 초기화
    function clearInfo() {
      allInfo = {};
      document.getElementById('infoGrid').innerHTML = '';
      document.getElementById('exportData').value = '';
    }

    // 페이지 로드 시 자동 수집
    window.addEventListener('load', collectAllInfo);
  </script>
</body>
</html>
