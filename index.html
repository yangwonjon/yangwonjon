<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스 결제 테스트</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
</head>
<body>
    <div style="padding: 20px; text-align: center;">
        <button id="pay-btn" style="width: 100%; height: 60px; background-color: #0050FF; color: white; border: none; border-radius: 10px; font-size: 18px;">
            토스 결제창 띄우기
        </button>
    </div>

    <script>
        // 공용 테스트용 클라이언트 키 (절대 수정 금지)
        const clientKey = "test_ck_D5mOjkJdnVvZEdAnExV8zYpW92mx";
        const tossPayments = TossPayments(clientKey);

        document.getElementById('pay-btn').addEventListener('click', function () {
            tossPayments.requestPayment('카드', {
                amount: 1000,
                orderId: 'order-' + new Date().getTime(),
                orderName: '테스트 상품',
                successUrl: window.location.origin,
                failUrl: window.location.origin,
            }).catch(function (error) {
                alert("에러 코드: " + error.code + "\n메시지: " + error.message);
            });
        });
    </script>
</body>
</html>
