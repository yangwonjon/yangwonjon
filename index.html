<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 실행 버튼 테스트</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .kakao { background-color: #FEE500; color: #3c1e1e; }
        .instagram { background: linear-gradient(45deg, #405de6, #5851db, #833ab4, #c13584, #e1306c, #fd1d1d); }
        .toss { background-color: #0050FF; }
    </style>
</head>
<body>

    <h2>앱 실행하기</h2>

    <button class="kakao" onclick="openApp('kakaotalk://')">카카오톡 열기</button>

    <button class="instagram" onclick="openApp('instagram://')">인스타그램 열기</button>

    <button class="toss" onclick="openApp('supertoss://')">토스 열기</button>

    <script>
        function openApp(url) {
            // 앱 실행 시도
            window.location.href = url;

            // 앱이 설치되지 않았을 경우를 대비한 처리 (선택 사항)
            // 0.5초 후에 반응이 없으면 아무 동작 안 하거나 안내 메시지를 띄울 수 있습니다.
            setTimeout(function() {
                console.log("앱 실행 시도 완료");
            }, 500);
        }
    </script>

</body>
</html>
