<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tab-title">🔒 인증 필요</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #FFF9F0; --point: #FF8A8A; --text: #4A4A4A; }
        body { margin: 0; padding: 0; background-color: var(--bg); font-family: 'Apple SD Gothic Neo', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        #lock { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999; }
        #main-content { display: none; width: 100%; justify-content: center; align-items: center; flex-direction: column; }
        .card { width: 85%; max-width: 400px; background: white; border-radius: 40px; padding: 50px 20px; box-shadow: 0 15px 35px rgba(230,220,200,0.4); text-align: center; border: 1px solid #F5EBD0; }
        .diary-link { cursor: pointer; }
        h1 { color: var(--text); font-size: 26px; }
        .names { color: var(--point); font-weight: bold; }
        
        /* 게시판 스타일 */
        #board { display: none; width: 90%; max-width: 500px; background: white; border-radius: 30px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        textarea { width: 100%; height: 100px; border: 1px solid #EEE; border-radius: 15px; padding: 15px; box-sizing: border-box; font-family: inherit; resize: none; margin-bottom: 10px; background: #FAFAFA; font-size: 16px; }
        .save-btn { width: 100%; background: var(--point); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* 글 목록 */
        #post-list { margin-top: 20px; text-align: left; max-height: 450px; overflow-y: auto; }
        .post-item { background: #FFF9F9; padding: 15px; border-radius: 15px; margin-bottom: 12px; border-left: 4px solid var(--point); position: relative; }
        .post-date { font-size: 11px; color: #BBB; margin-bottom: 5px; }
        .delete-btn { position: absolute; top: 12px; right: 12px; color: #EEE; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { color: var(--point); }
    </style>
</head>
<body>

<div id="lock"></div>

<div id="main-content">
    <div id="main-page" class="card">
        <div class="diary-link" onclick="showBoard()">
            <div style="font-size: 50px; margin-bottom: 15px;">📔</div>
            <h1><span class="names">원준 & 유현</span> 일기장</h1>
            <small style="color: #FFBABA;">(클릭해서 기록 보기/쓰기)</small>
        </div>
    </div>

    <div id="board">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <strong style="color: var(--point); font-size: 18px;">우리들의 기록장</strong>
            <span style="cursor: pointer; font-size: 24px;" onclick="showMain()">✕</span>
        </div>
        <textarea id="post-input" placeholder="오늘의 추억을 기록해봐요..."></textarea>
        <button class="save-btn" onclick="addPost()">기록하기</button>
        <div id="post-list"></div>
    </div>
</div>

<script>
    // 1. 제공해주신 Supabase 정보 적용
    const SUPABASE_URL = "https://wmpqwkvbhpikoyepecya.supabase.co";
    const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtcHF3a3ZiaHBpa295ZXBlY3lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1NDg1OTgsImV4cCI6MjA5MTEyNDU5OH0.QB2jIsi_dXzrS-cAY3MCKfjO9p69a7pJ2PDEbflE4V0";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.onload = function() {
        const pw = prompt("비밀번호 4자리를 입력하세요.");
        if (pw === "0408") {
            document.getElementById("lock").style.display = "none";
            document.getElementById("main-content").style.display = "flex";
            document.title = "원준 & 유현 일기장";
            fetchPosts(); // 페이지 열릴 때 글 목록 가져오기
        } else {
            alert("틀렸습니다.");
            location.reload();
        }
    };

    function showBoard() { document.getElementById("main-page").style.display = "none"; document.getElementById("board").style.display = "block"; }
    function showMain() { document.getElementById("board").style.display = "none"; document.getElementById("main-page").style.display = "block"; }

    // 글쓰기 (DB 저장)
    async function addPost() {
        const input = document.getElementById("post-input");
        const content = input.value.trim();
        if (!content) return;

        const { error } = await _supabase.from('posts').insert([{ content: content }]);
        if (error) {
            alert("저장 실패! Supabase 테이블 설정을 확인해주세요.");
            console.error(error);
        } else {
            input.value = "";
            fetchPosts();
        }
    }

    // 글 가져오기 (실시간 데이터)
    async function fetchPosts() {
        const { data, error } = await _supabase.from('posts').select('*').order('created_at', { ascending: false });
        if (error) {
            console.error("데이터 로드 실패:", error);
            return;
        }
        
        const list = document.getElementById("post-list");
        list.innerHTML = data.map(post => `
            <div class="post-item">
                <div class="post-date">${new Date(post.created_at).toLocaleString('ko-KR')}</div>
                <div style="white-space: pre-wrap;">${post.content}</div>
                <span class="delete-btn" onclick="deletePost(${post.id})">삭제</span>
            </div>
        `).join('');
    }

    // 삭제 기능
    async function deletePost(id) {
        if (!confirm("이 기록을 지울까요?")) return;
        const { error } = await _supabase.from('posts').delete().eq('id', id);
        if (error) alert("삭제 실패!");
        else fetchPosts();
    }
</script>

</body>
</html>
